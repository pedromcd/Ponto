{% extends "base.html" %}{% block content %}<h1>Fechamento mensal</h1><form method="get"><input name="month" type="month" value="{{month}}"><button>Filtrar</button></form><p><a href="/exportar.csv?month={{month}}">Exportar CSV</a> | <a href="/exportar.xlsx?month={{month}}">Exportar Excel</a></p><table><tr><th>Funcionário</th><th>Marcações</th><th>Horas</th><th>Pendências</th></tr>{% for e in entries %}<tr><td><a href="/fechamento/{{e.person.id}}?month={{month}}">{{e.person.name}}</a></td><td>{{e.punches}}</td><td>{{e.hours}} h</td><td>{{e.pending}}</td></tr>{% endfor %}</table>{% endblock %}
