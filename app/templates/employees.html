{% extends "base.html" %}{% block content %}<h1>Funcionários</h1><section><form action="/funcionarios" method="post"><input name="name" placeholder="Nome" required maxlength="100"><input name="department" placeholder="Setor" maxlength="100"><button>Adicionar</button></form></section><table><tr><th>Nome</th><th>Setor</th><th>Status</th><th>Ações</th></tr>{% for p in people %}<tr><td>{{p.name}}</td><td>{{p.department}}</td><td>{{"Ativo" if p.active else "Desligado"}}</td><td>{% if p.active %}<form action="/funcionarios/{{p.id}}/desativar" method="post"><button>Desativar</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
